name: EAS Update

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eas-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Verify app before publishing
        run: npm run check

      - name: Publish OTA update
        run: eas update --channel production --environment production --non-interactive --message "${{ github.event.head_commit.message || 'manual update' }}"
