name: EAS Update

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eas-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Verify app before publishing
        run: npm run check

      # 커밋 메시지를 run 에 바로 넣으면 셸이 해석합니다(따옴표로 깨지고, $(...) 는 실행됨) — env 로만 넘깁니다.
      - name: Publish OTA update
        env:
          MESSAGE: ${{ github.event.head_commit.message || 'manual update' }}
        run: eas update --channel production --environment production --non-interactive --message "$MESSAGE"
